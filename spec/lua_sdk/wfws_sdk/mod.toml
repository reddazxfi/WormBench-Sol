# WFWS Sprite Builder -- the editor's own flight-art builder.
#
# A library bundle: no components of its own, so it never appears on a panel.
# A weapon pulls it in with `dependencies = ["wfws.sdk"]` and then:
#
#   local sb = require("wf-lib/wfws_sprite_builder")
#
# `holds` lives in wf.sdk and is required by its public module name, so that
# dependency is declared below. `wf.sdk` also keeps the hold builder working;
# this bundle only replaces the flight builder.
id = "wfws.sdk"
name = "WFWS Engine SDK"
version = "1.1.5"
author = "red / WFWS-E"
api_version = 5
format_version = 2
dependencies = ["wf.sdk"]
asset_namespace = "wf-lib/wfws"

[sprites."sprites/beam.png"]
[sprites."sprites/beam_glow.png"]
[sprites."sprites/beam_glow_endpoint.png"]
[sprites."sprites/beam_orb.png"]
[sprites."sprites/beam_soft.png"]
[sprites."sprites/beam_glow_soft.png"]
[sprites."sprites/beam_end_soft.png"]
[sprites."sprites/beam_orb_soft.png"]
[sprites."sprites/beam_plasma.png"]
[sprites."sprites/beam_glow_plasma.png"]
[sprites."sprites/beam_end_plasma.png"]
[sprites."sprites/beam_orb_plasma.png"]

[exports]
"wf-lib/wfws_sprite_builder" = "lib/wfws_sprite_builder.lua"
"wf-lib/wfws_swing" = "lib/wfws_swing.lua"
"wf-lib/wfws_airstrike" = "lib/wfws_airstrike.lua"
"wf-lib/wfws_firing" = "lib/wfws_firing.lua"
"wf-lib/wfws_trail" = "lib/wfws_trail.lua"
